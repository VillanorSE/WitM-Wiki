[project]
site_name = "War in the Mediterranean"
site_description = "Player wiki for War in the Mediterranean, a WW2 scenario for Space Engineers"
site_url = "https://villanorse.github.io/WitM-Wiki/"
copyright = "Fan-made scenario wiki. Not affiliated with or endorsed by Keen Software House. Space Engineers is a trademark of Keen Software House. Written with AI assistance and reviewed by the mod author."
extra_css = ["assets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    { "Getting Started" = "start/getting-started.md" },
    { "What's New" = "start/whats-new.md" },
    { "Chat Commands" = "start/chat-commands.md" },
    { "Playing on the Server" = "start/playing-on-the-server.md" },
  ] },
  { "The world" = [
    { "The Map" = "world/map.md" },
    { "Factions and Sides" = "world/factions.md" },
    { "Territory and War Level" = "world/territory-war-level.md" },
    { "War News and Supply" = "world/war-news-supply.md" },
  ] },
  { "Encounters" = [
    { "Installations" = "encounters/installations.md" },
    { "At Sea" = "encounters/sea.md" },
    { "In the Air" = "encounters/air.md" },
    { "On the Ground" = "encounters/ground.md" },
  ] },
  { "Ships, vehicles and combat" = [
    { "Ship Cores and Block Limits" = "combat/ship-cores.md" },
    { "Weapons" = "combat/weapons.md" },
    { "Capturing Vehicles" = "combat/capturing.md" },
    { "Rosters" = "combat/rosters.md" },
  ] },
  { "Economy and building" = [
    { "Stores and Prices" = "economy/stores.md" },
    { "Salvage and Special Components" = "economy/salvage.md" },
    { "Building" = "economy/building.md" },
  ] },
  { "Reference" = [
    { "Mod List" = "reference/mod-list.md" },
    { "World Settings" = "reference/world-settings.md" },
    { "Glossary" = "reference/glossary.md" },
    { "Credits" = "reference/credits.md" },
  ] },
]

[project.theme]
language = "en"
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
  "content.tooltips",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.snippets.auto_append = ["includes/abbreviations.md"]
